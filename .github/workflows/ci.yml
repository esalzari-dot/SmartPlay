name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # Parallelismo limitato esplicitamente: con "-j" senza numero make satura la RAM
        # del runner compilando in parallelo i moduli JUCE di tutti i target, e il runner
        # viene terminato ("The runner has received a shutdown signal").
        run: cmake --build build --config Release -j 4

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config Release
